name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p oxishell
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target/release/oxishell.exe oxishell.exe
          (Get-FileHash oxishell.exe -Algorithm SHA256).Hash.ToLower() + "  oxishell.exe" | Out-File -Encoding ascii oxishell.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: oxishell-windows-x64
          path: |
            oxishell.exe
            oxishell.exe.sha256

  release-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p oxishell
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target/release/oxishell.exe oxishell.exe
          (Get-FileHash oxishell.exe -Algorithm SHA256).Hash.ToLower() + "  oxishell.exe" | Out-File -Encoding ascii oxishell.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            oxishell.exe
            oxishell.exe.sha256
